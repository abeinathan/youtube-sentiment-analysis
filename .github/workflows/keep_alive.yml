name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:      # Allows manual testing

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Full Wake-up Call
        # -sL follows redirects and performs a GET; > /dev/null hides the output
        run: curl -sL https://abei-sentimentanalysis.streamlit.app/ > /dev/null
