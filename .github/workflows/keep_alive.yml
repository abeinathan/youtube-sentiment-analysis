name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # Runs every 3 days
  workflow_dispatch:      # Allows you to click a button to run it manually

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -I https://abei-sentimentanalysis.streamlit.app/
