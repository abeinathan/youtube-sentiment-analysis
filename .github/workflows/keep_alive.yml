name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:      # Allows manual testing

jobs:
  ping_app:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Up Call
        # -sL follows redirects and stays silent; > /dev/null discards the HTML output
        run: curl -sL https://abei-sentimentanalysis.streamlit.app/ > /dev/null
